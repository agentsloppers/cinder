<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CINDER — a dark fantasy action RPG, built by an AI</title>
<meta name="description" content="CINDER: third-person dark fantasy action RPG in your browser. Stamina combat, rolls, parries, bosses, and a summon system. Built in public by an autonomous AI.">
<meta property="og:title" content="CINDER — dark fantasy action RPG"><meta property="og:description" content="Playable in your browser. Built in public by an AI.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23e8641a%27/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#d9b46a;--g2:#8a6a2c;--bg:#0b0a0e;--tx:#e8d9b8;--dim:#9a8f78}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#load{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1b1410,#050406);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50}
#load .l{font:900 64px Cinzel,serif;letter-spacing:.3em;color:var(--g);text-shadow:0 0 30px #d9742a88}
#lbarw{width:320px;height:3px;background:#2a2218}#lbar{height:100%;width:0;background:var(--g);transition:width .3s}#lt{color:var(--dim);font-size:13px;letter-spacing:.1em}
#err{display:none;position:fixed;left:10px;bottom:10px;background:#4a0d0d;color:#fff;padding:8px 12px;z-index:99;font-size:12px;border-radius:6px;max-width:80vw}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud{display:none}
.bars{position:absolute;left:28px;top:24px;display:flex;flex-direction:column;gap:6px}
.bar{height:14px;background:#0009;border:1px solid #000;box-shadow:0 0 0 1px #6a5a3a;position:relative;overflow:hidden}
.bar i,.bar b{position:absolute;left:0;top:0;bottom:0}
#hpbar{height:16px}#hpf{background:linear-gradient(#d8453a,#8a1c1c);z-index:2}#hpg{background:#e8b04a;z-index:1}
#stbar{height:11px}#stf{background:linear-gradient(#6fd06a,#2f8a3a)}
#fpbar{height:9px}#fpf{background:linear-gradient(#5aa4ff,#2a54b0)}
#flasks{font-size:14px;color:var(--g);margin-top:4px;text-shadow:0 1px 2px #000}
#wpn{position:absolute;left:28px;bottom:26px;font:600 13px Cinzel,serif;color:var(--dim)}
.cur2{position:absolute;right:28px;bottom:24px;text-align:right;font:700 20px Cinzel,serif;color:var(--g);text-shadow:0 2px 4px #000}
.cur2 small{display:block;font:500 13px Inter;color:#c58bff}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);opacity:0;font:600 17px Cinzel,serif;background:#000a;padding:8px 18px;border:1px solid #6a5a3a;transition:opacity .2s}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);font:600 18px Cinzel,serif;opacity:0;text-shadow:0 2px 6px #000}#toast.on{animation:tt 2.4s forwards}
@keyframes tt{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;opacity:0;pointer-events:none}
.banner .bt{font:900 56px Cinzel,serif;letter-spacing:.2em;color:var(--g);text-shadow:0 0 40px #d9742a}.banner .bs{font:500 16px Inter;color:var(--tx);letter-spacing:.15em;margin-top:6px}
.banner.on{animation:bn 4.2s forwards}.banner.felled .bt{color:#e8c46a;font-size:64px}
@keyframes bn{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#boss{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);width:min(760px,70vw);opacity:0;transition:opacity .5s;text-align:left}
#bossn{font:700 20px Cinzel,serif;color:#f0e0c0;text-shadow:0 2px 4px #000}#bosst{font:500 12px Inter;color:var(--dim);margin-bottom:4px;letter-spacing:.1em}
.bossbar{height:14px;background:#000a;border:1px solid #000;box-shadow:0 0 0 1px #8a6a2c}#bossf{height:100%;background:linear-gradient(#c0392b,#6e1010);transition:width .15s}
#lock{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px;border:2px solid #fff;border-radius:50%;opacity:0;box-shadow:0 0 8px #fff;background:radial-gradient(circle,#fff 0 2px,transparent 3px)}
#ebar{position:absolute;left:50%;top:7%;transform:translateX(-50%);width:260px;opacity:0;transition:opacity .2s;text-align:center}#ebn{font:600 13px Cinzel,serif;text-shadow:0 1px 3px #000}#ebar .eb{height:7px;background:#000a;border:1px solid #000;box-shadow:0 0 0 1px #6a5a3a}#ebf{height:100%;background:#b8322a}
#spirit{position:absolute;right:28px;top:26px;display:none;align-items:center;gap:10px;background:#000a;padding:6px 12px;border:1px solid #6a5a3a;position:absolute;overflow:hidden}
#spirit .si{font-size:26px}#spirit .sn{font-size:12px;line-height:1.3}#spirit i{position:absolute;left:0;bottom:0;height:3px;background:#c58bff}
#hurtfx{position:absolute;inset:0;background:radial-gradient(transparent 55%,#8a0000aa);opacity:0}
#died{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 90px Cinzel,serif;letter-spacing:.25em;color:#a31616;text-shadow:0 0 50px #000;background:radial-gradient(#0000,#000b);opacity:0;transition:opacity 1.2s}#died.on{opacity:1}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20}
.fl{position:absolute;font:700 18px Cinzel,serif;color:#fff;text-shadow:0 2px 3px #000;pointer-events:none;white-space:nowrap}.fl.crit{color:#ffd24a;font-size:24px}.fl.me{color:#ff6a5a}
#menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;pointer-events:auto;background:#000a}
.panel{background:linear-gradient(#17130f,#0d0b0a);border:1px solid #6a5a3a;box-shadow:0 0 60px #000,inset 0 0 40px #0008;padding:32px 40px;max-width:min(720px,92vw);max-height:90vh;overflow:auto;text-align:center}
.panel h2{font:700 28px Cinzel,serif;color:var(--g);margin:0 0 14px;letter-spacing:.15em}
.panel.title{background:none;border:none;box-shadow:none;max-width:none}
.logo{font:900 clamp(56px,11vw,120px) Cinzel,serif;letter-spacing:.3em;color:var(--g);text-shadow:0 0 60px #d9742a,0 4px 0 #000;margin-right:-.3em}
.tag{color:var(--tx);letter-spacing:.2em;font-size:13px;text-transform:uppercase;margin:6px 0 34px;opacity:.85}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.btns.col{flex-direction:column;align-items:center}
button{font:600 15px Cinzel,serif;letter-spacing:.12em;background:linear-gradient(#2a2118,#15110c);color:var(--tx);border:1px solid #6a5a3a;padding:11px 26px;cursor:pointer;transition:.15s;pointer-events:auto}
button:hover{background:linear-gradient(#4a3820,#241a10);border-color:var(--g);color:#fff;box-shadow:0 0 18px #d9b46a44}button:disabled{opacity:.4;cursor:default}
.fine{margin-top:36px;font-size:12px;color:var(--dim)}.fine a{color:var(--g)}
.dim{color:var(--dim);font-size:13px;line-height:1.5}
.ctl{margin:0 auto 14px;border-collapse:collapse;font-size:14px;text-align:left}.ctl td{padding:5px 14px;border-bottom:1px solid #2a2218}.ctl td:first-child{color:var(--g)}
pre.cred{text-align:left;font:12px/1.5 Inter;white-space:pre-wrap;max-height:42vh;overflow:auto;background:#0006;padding:12px;color:#c9bfa8}
.hub{width:min(1000px,96vw);height:min(660px,92vh);background:linear-gradient(#17130f,#0b0908);border:1px solid #6a5a3a;box-shadow:0 0 80px #000;display:flex;flex-direction:column;text-align:left}
.hubhead{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;border-bottom:1px solid #2a2218}
.hubt{font:700 26px Cinzel,serif;color:var(--g);letter-spacing:.14em}.cur{display:flex;gap:22px;font-size:15px}.cc{color:var(--g)}.ce{color:#c58bff}
.tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid #2a2218}.tabs button{border-bottom:none;padding:9px 20px;font-size:13px}.tabs button.on{background:#3a2c18;border-color:var(--g);color:#fff}
.tabbody{flex:1;overflow:auto;padding:20px 26px}.hubfoot{padding:12px 26px;border-top:1px solid #2a2218;text-align:right}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 30px}.stat{display:flex;justify-content:space-between;align-items:center;background:#ffffff08;padding:6px 12px}.stat button{padding:2px 12px;font-size:16px}.sv{color:var(--g);font-weight:700}
.lvbig{font:700 22px Cinzel,serif;margin-bottom:12px}.derived{margin-top:14px;color:var(--dim);font-size:13px;line-height:1.8}.trade{margin-top:16px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.wcard{display:flex;gap:12px;align-items:center;background:#ffffff08;border:1px solid #2a2218;padding:10px;cursor:pointer;pointer-events:auto}.wcard:hover,.wcard.eq{border-color:var(--g);background:#d9b46a14}
.wg{font-size:28px;width:40px;text-align:center}.ref{color:#ffb347;font-size:12px}.wdesc{margin-top:16px;min-height:80px;font-style:italic}
.banners{display:flex;gap:10px;margin-bottom:14px}.bn{padding:8px 16px;border:1px solid #2a2218;cursor:pointer;background:#ffffff06}.bn.on{border-color:var(--g);background:#d9b46a18}.bn b{font-family:Cinzel,serif}.bs{font-size:11px;color:var(--dim)}
.bhero{display:flex;gap:20px}.binfo{flex:1}.bart{width:200px;min-height:200px;background:radial-gradient(circle,#c58bff44,#0000 70%);display:flex;align-items:center;justify-content:center;font-size:90px}
.feat{margin:8px 0}.lore{font-style:italic;color:var(--dim);font-size:13px;margin:8px 0;line-height:1.5}.pbar{height:6px;background:#000;border:1px solid #3a2c18;margin:4px 0}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#c58bff,#ffb347)}.pity{font-size:13px;color:var(--dim);line-height:1.6}
.pullrow{display:flex;gap:12px;margin-top:16px}.pull.big{border-color:#ffb347}
.reveal{position:fixed;inset:0;z-index:40;background:radial-gradient(circle,#1d1428,#030204);display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;flex-direction:column}
.rcard{width:300px;padding:28px;text-align:center;border:2px solid #9a9a9a;background:linear-gradient(#1c1812,#0c0a08);animation:pop .5s}.rcard.r4{border-color:#c58bff;box-shadow:0 0 60px #c58bff66}.rcard.r5{border-color:#ffb347;box-shadow:0 0 90px #ffb347aa}.rcard.r3{border-color:#7fb4ff}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.rglyph{font-size:84px}.rname{font:700 24px Cinzel,serif;margin:8px 0}.rstar{letter-spacing:4px;color:var(--g)}.rtype,.rflag{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.2em}.rdesc{font-size:13px;color:#c9bfa8;margin-top:10px;line-height:1.5}.rhint{position:absolute;bottom:30px;color:var(--dim);font-size:12px}
.sumgrid{display:grid;grid-template-columns:repeat(5,110px);gap:10px}.sc{padding:12px 4px;border:2px solid #9a9a9a;background:#0008;text-align:center;font-size:11px}.sc.r4{border-color:#c58bff}.sc.r5{border-color:#ffb347;box-shadow:0 0 20px #ffb34788}.sc.r3{border-color:#7fb4ff}
@media(max-width:700px){.hub{height:96vh}.sumgrid{grid-template-columns:repeat(2,110px)}.bhero{flex-direction:column}}
.links{position:fixed;right:10px;bottom:6px;z-index:6;font-size:11px;opacity:.5}.links a{color:#fff}
</style></head><body>
<canvas id="c" tabindex="0"></canvas>
<div id="ui">
 <div id="hud">
  <div class="bars"><div class="bar" id="hpbar"><b id="hpg"></b><i id="hpf" style="width:100%"></i></div><div class="bar" id="stbar"><i id="stf"></i></div><div class="bar" id="fpbar"><i id="fpf"></i></div><div id="flasks"></div></div>
  <div id="wpn"></div>
  <div class="cur2"><span id="cinders">0</span> ◆<small>✹ <span id="embers">0</span> embers</small></div>
  <div id="spirit"></div><div id="lock"></div>
  <div id="ebar"><div id="ebn"></div><div class="eb"><div id="ebf"></div></div></div>
  <div id="boss"><div id="bossn"></div><div id="bosst"></div><div class="bossbar"><div id="bossf"></div></div></div>
  <div id="prompt"></div><div id="toast"></div><div id="banner" class="banner"></div><div id="hurtfx"></div>
 </div>
 <div id="died">YOU DIED</div>
</div>
<div id="menu"></div><div id="fade"></div>
<div id="load"><div class="l">CINDER</div><div id="lbarw"><div id="lbar"></div></div><div id="lt">Loading…</div></div>
